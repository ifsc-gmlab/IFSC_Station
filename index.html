  <header class="toolbar" id="toolbar">
    <!-- 左: IFSC 品牌区 + 视图切换 -->
    <div class="toolbar-brand">
      <button class="hamburger" id="btnMenu" title="主菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
      <img class="logo" src="qrc/resources/icons/IFSC_logo.png" alt="IFSC" />
      <div class="brand-text">
        IFSC-Station
        <small>Ground Control Station</small>
      </div>
    </div>

    <!-- 中: 视图切换 (Fly / Plan / Analyze / Setup) -->
    <div class="toolbar-views">
      <button class="tb-btn active" data-view="fly">
        <img class="icon" src="qrc/resources/toolbar/PaperPlane.svg" alt=""/>
        Fly
      </button>
      <button class="tb-btn" data-view="plan">
        <img class="icon" src="qrc/resources/toolbar/Plan.svg" alt=""/>
        Plan
      </button>
      <button class="tb-btn" data-view="analyze">
        <img class="icon" src="qrc/resources/toolbar/Analyze.svg" alt=""/>
        Analyze
      </button>
      <button class="tb-btn" data-view="setup">
        <img class="icon" src="qrc/resources/toolbar/Gears.svg" alt=""/>
        Setup
      </button>
      <button class="tb-btn" data-view="params" title="参数编辑 (QGC Parameter Editor)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 6h18M3 12h18M3 18h12"/>
          <circle cx="20" cy="18" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        Params
      </button>
    </div>
